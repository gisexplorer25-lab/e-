<title>Short Code Assistant</title>
<style>
:root{--navy:#151515;--navy2:#2a2a2a;--blue:#e00800;--green:#16a34a;--red:#8a0600;--bg:#f4f4f5;--card:#fff;--tx:#141414;--mut:#6b7280;--bd:#e5e7eb}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;font-size:16px}
button,input,select,textarea{font:inherit}
.btn{border:0;border-radius:10px;padding:10px 18px;cursor:pointer;font-weight:600;background:var(--blue);color:#fff;transition:.15s}
.btn:hover{filter:brightness(1.1)}.btn.gr{background:var(--green)}.btn.rd{background:var(--red)}.btn.gh{background:#e2e8f0;color:var(--tx)}.btn.sm{padding:6px 12px;font-size:.85rem}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy),#1e3a8a);padding:16px}
.lbox{background:#fff;border-radius:18px;padding:32px;width:100%;max-width:400px;box-shadow:0 20px 50px #0006}
.lbox h1{color:var(--navy);text-align:center;margin-bottom:4px}.lbox .sub{text-align:center;color:var(--mut);margin-bottom:20px;font-size:.9rem}
.fld{margin-bottom:14px}.fld label{display:block;font-weight:600;margin-bottom:5px;font-size:.9rem}
.fld input,.fld select,.fld textarea{width:100%;padding:11px 12px;border:1.5px solid var(--bd);border-radius:10px;background:#fff}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:0;border-color:var(--blue)}
.err{color:var(--red);font-size:.9rem;min-height:20px;margin-bottom:8px}
.note{font-size:.78rem;color:var(--mut);text-align:center;margin-top:14px}
.lbox .btn{width:100%;padding:12px}
/* admin */
.shell{display:flex;min-height:100vh}
.side{width:240px;background:var(--navy);color:#cbd5e1;padding:20px 12px;display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.side h2{color:#fff;font-size:1.1rem;padding:0 10px 16px}
.side a{display:block;padding:11px 14px;border-radius:10px;cursor:pointer}
.side a:hover{background:var(--navy2)}.side a.on{background:var(--blue);color:#fff}.side .sp{flex:1}
.main{flex:1;padding:24px;min-width:0}
.top{display:none;background:var(--navy);color:#fff;padding:10px 14px;align-items:center;gap:12px}
.top button{background:none;border:0;color:#fff;font-size:1.5rem;cursor:pointer}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px;flex-wrap:wrap}
.hd h2{color:var(--navy)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.st{background:var(--card);border-radius:14px;padding:20px;border-inline-start:5px solid var(--blue);box-shadow:0 1px 4px #0001}
.st b{display:block;font-size:2rem;color:var(--navy)}.st span{color:var(--mut)}
.tw{background:var(--card);border-radius:14px;overflow-x:auto;box-shadow:0 1px 4px #0001}
table{width:100%;border-collapse:collapse;min-width:520px}
th,td{padding:12px 14px;text-align:start;border-bottom:1px solid var(--bd)}
th{background:#f8fafc;color:var(--mut);font-size:.85rem}
td .btn{margin-inline-end:6px}
.badge{padding:3px 10px;border-radius:99px;font-size:.8rem;font-weight:600}.badge.a{background:#dcfce7;color:#166534}.badge.i{background:#fee2e2;color:#991b1b}
.empty{padding:28px;text-align:center;color:var(--mut)}
.ltr{direction:ltr;unicode-bidi:isolate;font-family:Consolas,monospace;text-align:start}
.card{background:var(--card);border-radius:14px;padding:20px;box-shadow:0 1px 4px #0001;margin-bottom:16px;max-width:520px}
.card h3{margin-bottom:12px;color:var(--navy)}
/* user */
.uhead{background:var(--navy);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.uhead h1{font-size:1.25rem}.uhead small{color:#94a3b8;display:block}
.uwrap{max-width:900px;margin:0 auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.cc{background:var(--card);border:2px solid transparent;border-radius:14px;padding:24px 18px;cursor:pointer;text-align:start;box-shadow:0 1px 5px #0001;transition:.15s;width:100%}
.cc:hover{border-color:var(--blue);transform:translateY(-2px)}
.cc b{display:block;font-size:1.2rem;color:var(--navy);margin-bottom:6px}.cc span{color:var(--mut);font-size:.9rem}
.cc.code b{margin:0;font-size:1.15rem}
.list{display:flex;flex-direction:column;gap:12px}
.ci{background:var(--card);border-radius:14px;box-shadow:0 1px 5px #0001;border:2px solid transparent;overflow:hidden;transition:border-color .25s}
.ci.open{border-color:var(--green)}
.ci .cc{display:flex;justify-content:space-between;align-items:center;box-shadow:none;border:0;border-radius:0;background:none;padding:20px 18px}
.ci .cc:hover{transform:none;background:#f8fafc}
.ci .cc i{font-style:normal;color:var(--mut);transition:transform .35s}
.ci.open .cc i{transform:rotate(180deg)}
.cx{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.ci.open .cx{grid-template-rows:1fr}
.cin{overflow:hidden;min-height:0;text-align:center;padding:0 16px;opacity:0;transition:opacity .3s,padding .35s}
.ci.open .cin{opacity:1;padding:4px 16px 20px}
.ci.open .big{animation:pop .4s ease}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.grid.gs{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gs .cc{text-align:center;padding:18px 10px;display:flex;align-items:center;justify-content:center;min-height:76px}
.gs .cc b{margin:0;font-size:1rem}.cc:active{transform:scale(.97)}
.pov{position:fixed;inset:0;background:#0f1f3d99;display:flex;align-items:center;justify-content:center;z-index:60;padding:14px;animation:fd .2s;cursor:pointer}
.pbox{background:#fff;border-radius:22px;padding:26px 24px 0;text-align:center;width:min(92vw,520px);overflow:hidden;box-shadow:0 20px 60px #0006;animation:pp .38s cubic-bezier(.2,1.3,.4,1)}
.pnm{color:var(--mut);font-size:1.15rem}.pok{color:var(--green);font-weight:700}
.pbar{height:6px;background:#e2e8f0;margin:18px -24px 0}.pbar i{display:block;height:100%;background:var(--green);animation:shr 3s linear forwards}
@keyframes fd{from{opacity:0}}@keyframes pp{from{transform:scale(.6);opacity:0}}@keyframes shr{from{width:100%}to{width:0}}
.bk{margin-bottom:16px}.ttl{color:var(--navy);margin-bottom:16px}
.show{background:var(--card);border-radius:18px;padding:30px 20px;text-align:center;box-shadow:0 2px 10px #0002}
.show .nm{color:var(--mut);font-size:1.2rem;margin-bottom:12px}
.big{direction:ltr;unicode-bidi:isolate;font-family:Consolas,monospace;font-size:clamp(2.4rem,9vw,5rem);font-weight:800;color:var(--green);background:#f0fdf4;border:2px dashed var(--green);border-radius:14px;padding:22px 10px;margin:10px 0 18px;word-break:break-all;user-select:all}
.ds{color:var(--mut);margin-bottom:16px}
/* overlay */
.ov{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:14px;z-index:50}
.md{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:440px;max-height:92vh;overflow:auto}
.md h3{margin-bottom:14px;color:var(--navy)}.md p{margin-bottom:18px;line-height:1.7}
.row{display:flex;gap:10px;justify-content:flex-end}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center}
.tt{background:var(--green);color:#fff;padding:12px 22px;border-radius:12px;font-weight:600;box-shadow:0 6px 20px #0004;animation:in .2s}.tt.err{background:var(--red)}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
@media(max-width:800px){
.top{display:flex}.shell{flex-direction:column}
.side{position:fixed;top:0;bottom:0;right:-260px;z-index:40;width:240px;transition:.2s}.side.open{right:0}
.main{padding:14px}.lbox{padding:24px}}
/* ===== Theme: red / black / white ===== */
.btn.gr{background:#151515}
.err{color:#c00700}
.login{background:radial-gradient(circle at 15% 20%,#e0080066 0,transparent 45%),radial-gradient(circle at 90% 90%,#e0080040 0,transparent 42%),#121212}
.lbox{border-top:6px solid #e00800}
.lg{width:64px;height:64px;border-radius:18px;background:#e00800;color:#fff;font:800 1.5rem/64px Arial,sans-serif;text-align:center;margin:0 auto 14px;box-shadow:0 8px 20px #e0080066}
.lbox h1{color:#151515}
.uhead,.top{border-bottom:4px solid #e00800}
.side a.on{background:#e00800}
.big{color:#e00800;background:#fff5f4;border-color:#e00800}
.pbar i{background:#e00800}.pok{color:#151515}
.cc{border-color:#e5e7eb}.cc:hover{border-color:#e00800}
.st{border-inline-start-color:#e00800}
th{background:#fafafa}
/* ===== Folders + search ===== */
.uwrap{max-width:1200px}
.sb{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid #e5e7eb;border-radius:14px;padding:4px 14px;margin-bottom:20px;box-shadow:0 1px 5px #0001}
.sb:focus-within{border-color:#e00800}
.sb input{flex:1;border:0;outline:0;padding:12px 4px;font-size:1.1rem;background:none;min-width:0}
.sb .x{border:0;background:#e5e7eb;border-radius:99px;width:30px;height:30px;cursor:pointer}.sb .x[hidden]{display:none}
.sh{color:#151515;margin:6px 0 12px;font-size:1rem}.sh:not(:first-child){margin-top:24px}
.grid.fo5{grid-template-columns:repeat(5,1fr);gap:14px}
@media(max-width:1000px){.grid.fo5{grid-template-columns:repeat(4,1fr)}}
@media(max-width:760px){.grid.fo5{grid-template-columns:repeat(3,1fr)}}
@media(max-width:520px){.grid.fo5{grid-template-columns:repeat(2,1fr);gap:10px}}
.fo{position:relative;background:linear-gradient(#fff,#fff6f5);border:2px solid #e5e7eb;border-radius:4px 14px 14px 14px;padding:30px 10px 18px;margin-top:12px;text-align:center;cursor:pointer;transition:.15s;box-shadow:0 1px 5px #0001;min-height:112px}
.fo .ft{position:absolute;top:-13px;inset-inline-start:-2px;width:46%;height:14px;background:#e00800;border-radius:8px 8px 0 0}
.fo:hover{border-color:#e00800;transform:translateY(-3px)}.fo:active{transform:scale(.97)}
.fo b{display:block;font-size:1.05rem;color:#151515;margin-bottom:6px}.fo small{color:var(--mut)}
.gs .cc{flex-direction:column}.cc small{display:block;color:var(--mut);margin-top:5px;font-size:.78rem;font-weight:400}
.bn{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:#fff5f4;border:2px solid #e00800;border-radius:12px;padding:12px 16px;margin-bottom:16px}
.sy{margin-bottom:12px;font-size:.9rem;color:var(--mut)}.sy.ok{color:var(--green);font-weight:600}
.tw2{position:relative;display:flex}.tw2 .cc{flex:1}
.te{position:absolute;top:6px;inset-inline-end:6px;display:flex;gap:4px}
.te button{border:0;background:#151515;color:#fff;border-radius:8px;width:28px;height:28px;cursor:pointer}.te button+button{background:#8a0600}
.hd .ttl{margin:0}.ck{display:flex;gap:8px;align-items:center;margin:4px 0 12px;font-size:.9rem;cursor:pointer}
.pen{border:0;background:#e00800;color:#fff;border-radius:99px;width:28px;height:28px;cursor:pointer;margin-inline-start:8px;vertical-align:middle;font-size:1rem}.pen.on{background:#fff;color:#e00800;box-shadow:0 0 0 2px #e00800}

/* ===== Login (e&) ===== */
.login{font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;background:#0c0c0d;position:relative;overflow:hidden;padding:20px}
.login::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 50% at 85% 10%,#e0080038 0,transparent 70%),radial-gradient(50% 45% at 10% 95%,#e0080026 0,transparent 70%);pointer-events:none}
.login::after{content:"";position:absolute;inset:0;background-image:radial-gradient(#ffffff0f 1px,transparent 1px);background-size:26px 26px;mask-image:radial-gradient(70% 70% at 50% 50%,#000 20%,transparent 100%);-webkit-mask-image:radial-gradient(70% 70% at 50% 50%,#000 20%,transparent 100%);pointer-events:none}
.lc{position:relative;z-index:1;width:100%;max-width:900px;display:grid;grid-template-columns:1fr 1.05fr;border-radius:26px;overflow:hidden;background:#fff;box-shadow:0 40px 90px #000a,0 0 0 1px #ffffff14;animation:lcin .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes lcin{from{opacity:0;transform:translateY(24px) scale(.98)}}
.lbrand{position:relative;background:#e00800;color:#fff;padding:44px 34px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:26px;overflow:hidden}
.lbrand::before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;border:1px solid #ffffff2e;top:-170px;left:-170px}
.lbrand::after{content:"";position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,#ffffff1c 0,transparent 65%);bottom:-260px;right:-200px}
.lbrand img{position:relative;z-index:1;width:min(230px,62%);height:auto;display:block;filter:drop-shadow(0 10px 24px #6a030033)}
.lbrand h2{position:relative;z-index:1;font-size:1.5rem;font-weight:700;letter-spacing:.2px;direction:ltr}
.lbrand p{position:relative;z-index:1;font-size:.98rem;line-height:1.8;color:#ffe9e7;max-width:280px;margin:-14px auto 0}
.lform{padding:46px 42px;display:flex;flex-direction:column;justify-content:center;background:#fff}
.lform h1{font-size:1.7rem;font-weight:700;color:#141414;margin:0 0 6px}
.lform .lsub{color:#6b7280;font-size:.95rem;margin-bottom:28px}
.lf{margin-bottom:16px}
.lf label{display:block;font-weight:600;font-size:.88rem;color:#2b2b2b;margin-bottom:7px}
.lw{position:relative}
.lw svg.ic{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);width:19px;height:19px;color:#9ca3af;transition:color .2s;pointer-events:none}
.lw input{width:100%;padding:13px 44px;border:1.5px solid #e5e7eb;border-radius:13px;background:#f8f8f9;font-size:1rem;color:#141414;transition:border-color .2s,background .2s,box-shadow .2s;direction:ltr;text-align:start}
.lw input::placeholder{color:#a3a3ab}
.lw input:hover{border-color:#d1d5db}
.lw input:focus{outline:0;border-color:#e00800;background:#fff;box-shadow:0 0 0 4px #e0080018}
.lw:focus-within svg.ic{color:#e00800}
.eye{position:absolute;inset-inline-end:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;background:none;border-radius:9px;cursor:pointer;color:#9ca3af;display:grid;place-items:center;transition:background .15s,color .15s}
.eye:hover{background:#f0f0f1;color:#141414}
.eye:focus-visible{outline:2px solid #e00800;outline-offset:1px}
.eye svg{width:19px;height:19px}
.rem{display:flex;align-items:center;gap:10px;margin:4px 0 6px;cursor:pointer;user-select:none;width:fit-content}
.rem input{position:absolute;opacity:0;width:0;height:0}
.rem .bx{width:20px;height:20px;border-radius:6px;border:1.5px solid #cfd2d8;background:#fff;display:grid;place-items:center;transition:all .18s;flex-shrink:0}

.rem input:checked+.bx{background:#e00800;border-color:#e00800}

.rem input:focus-visible+.bx{box-shadow:0 0 0 4px #e0080028}

async function pushRemote(){
 if(!canWrite())return;
 if(pushing){again=true;return}
 pushing=true;setSync("saving");let merged=false;
 try{
  const idt=await fbToken();
  for(let i=0;;i++){if(await pushOnce(idt))break;merged=true;if(i>=2)throw{message:"تعارض أثناء الحفظ، حاول مرة أخرى"}}
  if(!again){S._dirty=false;save(true)}setSync("ok");if(merged)refreshUI()
 }catch(e){console.error(e);setSync("err","⚠ فشل الحفظ على Firebase: "+fbMsg(e))}
 pushing=false;if(again){again=false;pushRemote()}}
function syncHTML(){
 if(!canWrite())return"";
 if(syncSt.st==="saving")return'<div class="sy">⏳ جاري الحفظ على Firebase...</div>';
 if(syncSt.st==="err"||(!syncSt.st&&S._dirty))return`<div class="bn"><span>${esc(syncSt.msg||"⚠ فيه تعديلات لم تُحفظ على Firebase بعد")}</span><button class="btn sm" data-act="retry">إعادة المحاولة</button></div>`;

 const om=(++pollN%5)!==0,r=await fetchRemote(om);
 if(!r||!r.cats||(r.c.t===rem.c.t&&(om||(r.u.t===rem.u.t&&r.u.e===rem.u.e))))return;
 setRem(r);S=fromRemote(r);await migrate(S);save(true);
 if(isAdm()){render();return}

 try{const a=document.createElement("textarea");a.value=t;a.setAttribute("readonly","");a.style.cssText="position:fixed;top:0;opacity:0";

function remGet(){try{const r=JSON.parse(localStorage.getItem(RK)||"null");if(r&&r.u)return{u:r.u,p:decodeURIComponent(atob(r.p||""))}}catch(e){}return null}
function remSet(u,p){try{localStorage.setItem(RK,JSON.stringify({u:u,p:btoa(encodeURIComponent(p))}))}catch(e){}}
function remClear(){try{localStorage.removeItem(RK)}catch(e){}}

/* ===== Signup requests (Firestore collection "signups", doc id = hex(username)) ===== */
const SIGN="https://firestore.googleapis.com/v1/projects/"+FB.projectId+"/databases/(default)/documents/signups";
const rid=u=>"u_"+hex(new TextEncoder().encode(norm(u)));
const fv=(f,k)=>(f&&f[k]&&f[k].stringValue)||"";
const reqObj=(id,f)=>({id:id,name:fv(f,"name"),username:fv(f,"username"),salt:fv(f,"salt"),hash:fv(f,"hash"),status:fv(f,"status")||"pending",created:fv(f,"created")});
async function getReq(un){try{const r=await fetch(SIGN+"/"+rid(un)+"?key="+FB.apiKey,{cache:"no-store"});
 if(r.status===404)return{state:"none"};if(r.status===403)return{state:"deny"};if(!r.ok)return{state:"err"};
 const j=await r.json();return{state:"ok",d:reqObj(rid(un),j.fields)}}catch(e){return{state:"err"}}}
async function createReq(o){try{const f={};["name","username","salt","hash"].forEach(k=>f[k]={stringValue:o[k]});
 f.status={stringValue:"pending"};f.created={stringValue:new Date().toISOString()};
 const r=await fetch(SIGN+"?documentId="+rid(o.username)+"&key="+FB.apiKey,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields:f})});
 if(r.ok)return"ok";if(r.status===409)return"taken";if(r.status===403)return"deny";return"err"}catch(e){return"err"}}
async function refreshUsers(){try{const r=await fetchRemote();if(r&&r.cats&&!S._dirty){setRem(r);S=fromRemote(r);await migrate(S);save(true)}}catch(e){}}
let REQ={list:[],err:"",ok:false};
async function loadReqs(){if(!isAdm()||!tok)return;let nx;
 try{const idt=await fbToken();const r=await fetch(SIGN+"?pageSize=300",{headers:{Authorization:"Bearer "+idt},cache:"no-store"});
  if(r.ok){const j=await r.json();nx={list:(j.documents||[]).map(d=>reqObj(d.name.split("/").pop(),d.fields)).sort((a,b)=>String(b.created).localeCompare(String(a.created))),err:"",ok:true}}
  else nx={list:REQ.list,err:r.status===403?"rules":"net",ok:false}}
 catch(e){nx={list:REQ.list,err:"net",ok:false}}
 const ch=JSON.stringify(nx)!==JSON.stringify(REQ);REQ=nx;if(ch&&isAdm()&&!$("#modal").innerHTML)render()}

 if(page==="cats")return`<div class="hd"><h2>Categories</h2><button class="btn" data-act="addcat">+ Add Category</button></div><div class="tw">${S.categories.length?`<table><tr><th>Order</th><th>Category Name</th><th>Description</th><th>Codes</th><th>Created</th><th>Actions</th></tr>${S.categories.map((c,i)=>`<tr><td style="white-space:nowrap"><button class="btn gh sm" data-act="catup" data-id="${c.id}"${i?"":" disabled"}>▲</button> <button class="btn gh sm" data-act="catdown" data-id="${c.id}"${i<S.categories.length-1?"":" disabled"}>▼</button></td><td>${esc(c.name)}</td><td>${esc(c.description)}</td><td>${c.codes.length}</td><td>${esc(c.created||"")}</td><td><button class="btn sm" data-act="editcat" data-id="${c.id}">Edit</button><button class="btn rd sm" data-act="delcat" data-id="${c.id}">Delete</button></td></tr>`).join("")}</table>`:'<div class="empty">لا توجد فئات.</div>'}</div>`;
 if(page==="codes"){const rows=allCodes().filter(x=>!fcat||x.cat.id===fcat);
  return`<div class="hd"><h2>Short Codes</h2><div class="row"><select class="btn gh" data-chg="fcat"><option value="">كل الفئات</option>${S.categories.map(c=>`<option value="${c.id}"${fcat===c.id?" selected":""}>${esc(c.name)}</option>`).join("")}</select><button class="btn" data-act="addcode">+ Add Code</button></div></div><div class="tw">${rows.length?`<table><tr><th>Category</th><th>Code Name</th><th>Short Code</th><th>Actions</th></tr>${rows.map(x=>`<tr><td>${esc(x.cat.name)}</td><td>${esc(x.k.name)}</td><td class="ltr">${esc(x.k.shortCode)}</td><td><button class="btn sm" data-act="editcode" data-id="${x.k.id}">Edit</button><button class="btn rd sm" data-act="delcode" data-id="${x.k.id}">Delete</button></td></tr>`).join("")}</table>`:'<div class="empty">لا توجد أكواد.</div>'}</div>`}
 if(page==="users")return`<div class="hd"><h2>Users</h2><button class="btn" data-act="adduser">+ Add User</button></div><div class="tw">${S.users.length?`<table><tr><th>Name</th><th>Username</th><th>Status</th><th>Edit Codes</th><th>Actions</th></tr>${S.users.map(u=>`<tr><td>${esc(u.name)}</td><td class="ltr">${esc(u.username)}</td><td><span class="badge ${u.status==="active"?"a":"i"}">${u.status==="active"?"Active":"Inactive"}</span></td><td>${u.edit?'<span class="badge a">✎ تعديل</span>':"—"}</td><td><button class="btn sm" data-act="edituser" data-id="${u.id}">Edit</button><button class="btn gr sm" data-act="toguser" data-id="${u.id}">${u.status==="active"?"Disable":"Enable"}</button><button class="btn rd sm" data-act="deluser" data-id="${u.id}">Delete</button></td></tr>`).join("")}</table>`:'<div class="empty">لا يوجد مستخدمون.</div>'}</div>`;
 if(page==="log"){const L=(S.log||[]).slice().reverse(),q=t=>"«"+esc(t)+"»",fmt=t=>{const d=new Date(t);return isNaN(d)?"":d.toLocaleString("en-GB",{hour12:false})};
  const tx=e=>e.a==="addFolder"?"أضاف فولدر "+q(e.c):e.a==="addCode"?"أضاف كود "+q(e.k)+' <span class="ltr">('+esc(e.n)+")</span> في فولدر "+q(e.c):e.a==="editCode"?"عدّل كود "+q(e.on&&e.on!==e.k?e.on+" ← "+e.k:e.k)+" في "+q(e.c)+(e.o!==e.n?' <span class="ltr">'+esc(e.o)+" → "+esc(e.n)+"</span>":""):esc(e.a);
  return`<div class="hd"><h2>Activity</h2><div class="row"><button class="btn gh" data-act="logref">⟳ Refresh</button><button class="btn rd" data-act="logclr">Clear Log</button></div></div><div class="tw">${L.length?`<table><tr><th>الوقت</th><th>الموظف</th><th>العملية</th></tr>${L.map(e=>`<tr><td class="ltr">${esc(fmt(e.t))}</td><td>${esc(e.by)}</td><td>${tx(e)}</td></tr>`).join("")}</table>`:'<div class="empty">لا توجد تعديلات من الموظفين حتى الآن.</div>'}</div>`}
 if(page==="settings")return`<div class="hd"><h2>Settings</h2></div><div class="card"><h3>الاتصال بـ Firebase</h3><p style="margin-bottom:12px;color:var(--mut);line-height:1.9;font-size:.9rem">المشروع: <b class="ltr">${esc(FB.projectId)}</b><br>حساب الأدمن: <b class="ltr">${esc(tok?tok.email:"")}</b><br>أي تعديل بيتحفظ تلقائيًا ويظهر للموظفين خلال دقيقة. لتغيير كلمة مرور الأدمن: Firebase Console ← Authentication.</p><div class="row" style="justify-content:flex-start;flex-wrap:wrap"><button class="btn gr" data-act="retry">Save Now</button><button class="btn gh" data-act="discard">Reload From Server</button></div></div><div class="card"><h3>نسخ احتياطي</h3><p style="margin-bottom:12px;color:var(--mut);line-height:1.7;font-size:.9rem">Export Backup: ملف JSON بكل البيانات. Import Backup: يستبدل البيانات الحالية ويحفظها على Firebase فتظهر للجميع.</p><div class="row" style="flex-wrap:wrap;justify-content:flex-start"><button class="btn" data-act="expjson">⬇ Export Backup</button><button class="btn gh" data-act="impjson">⬆ Import Backup</button></div><input type="file" id="impf" accept=".json,application/json" hidden></div><div class="card"><h3>Reset All Data</h3><p style="margin-bottom:12px;color:var(--mut)">حذف جميع الفئات والأكواد والمستخدمين (من Firebase أيضًا).</p><button class="btn rd" data-act="reset">Reset All Data</button></div>`;
 return""}

/* ===== Actions ===== */
function act(a,id){
 const ok=()=>{save();render()};
 switch(a){
 case"close":closeModal();break;
 case"logout":lmode="in";closePop();q="";tok=null;session=null;ucat=ucode=null;menu=false;closeModal();render();break;
 case"theme":{const d=document.documentElement,n=d.dataset.theme==="dark"?"light":"dark";d.dataset.theme=n;try{localStorage.setItem("ShortCodeAssistant_theme",n)}catch(e){}break}
 case"reqref":loadReqs();toast("جاري التحديث");break;
 case"copyrules":copyText(($("#rulesTx")||{}).textContent||"").then(o=>toast(o?"تم نسخ القواعد":"تعذر النسخ",o?"":"err"));break;
 case"reqok":{const q=REQ.list.find(x=>x.id===id);if(!q)break;
  if(!/^[0-9a-f]{64}$/.test(q.hash)||!q.salt){toast("بيانات الطلب غير صالحة","err");break}
  if(norm(q.username)==="admin"||S.users.some(x=>norm(x.username)===norm(q.username))){toast("اسم المستخدم موجود بالفعل","err");break}
  S.users.push({id:uid(),name:q.name,username:q.username,status:"active",salt:q.salt,hash:q.hash});
  REQ.list=REQ.list.filter(x=>x.id!==id);ok();toast("تمت الموافقة، تقدر "+q.name+" يدخل دلوقتي");
  (async()=>{await pushRemote();try{if(!S._dirty)await reqDel(id);else await reqPatch(id,"approved")}catch(e){console.error(e)}})();break}
 case"reqno":{const q=REQ.list.find(x=>x.id===id);if(!q)break;
  confirmModal("رفض طلب «"+esc(q.name)+"»؟ مش هيقدر يدخل وهتظهر له رسالة إن الأدمن رفض دخوله.","Reject",async()=>{
   try{await reqPatch(id,"rejected");q.status="rejected";render();toast("تم رفض الطلب")}catch(e){toast(fbMsg(e),"err")}},"Reject Request");break}
 case"reqdel":{const q=REQ.list.find(x=>x.id===id);if(!q)break;
  confirmModal("حذف الطلب نهائيًا؟ ممكن بعدها نفس اليوزر يقدّم من جديد.","Delete",async()=>{
   try{await reqDel(id);REQ.list=REQ.list.filter(x=>x.id!==id);render();toast("تم حذف الطلب")}catch(e){toast(fbMsg(e),"err")}},"Delete Request");break}
 case"menu":menu=!menu;render();break;
 case"nav":page=id;menu=false;render();if(id==="users")loadReqs();if(id==="creq")loadCReqs();if(id==="log")act("logref");break;
 case"logref":{if(S._dirty||pushing){toast("فيه تعديلات لسه بتتحفظ، جرّب بعد لحظات","err");break}
  fetchRemote().then(r=>{if(!r||!r.cats){toast("تعذر جلب البيانات من Firebase","err");return}setRem(r);S=fromRemote(r);save(true);if(isAdm())render()});break}
 case"logclr":confirmModal("هل أنت متأكد من مسح سجل التعديلات؟","Clear",()=>{S.log=[];ok()},"Clear Log");break;
 case"catup":case"catdown":{const i=S.categories.findIndex(c=>c.id===id),j=a==="catup"?i-1:i+1;if(i<0||j<0||j>=S.categories.length)break;[S.categories[i],S.categories[j]]=[S.categories[j],S.categories[i]];ok();break}
 case"ucat":q="";ucat=id;ucode=null;render();break;
 case"qclear":{q="";const i=$("#uq");if(i){i.value="";i.focus()}$("#ubody").innerHTML=userBody();$("#qx").hidden=true;break}
 case"uback1":closePop();ucat=ucode=null;render();break;
 case"uback2":ucode=null;render();break;
 case"ucode":{const x=allCodes().find(v=>v.k.id===id);if(x)showCode(x.k);break}
 case"popclose":closePop();break;
 case"again":{const k=findCat(ucat).codes.find(x=>x.id===ucode);if(k)doCopy(k.shortCode);break}
 case"addcat":case"editcat":{const c=a==="editcat"?findCat(id):null;
  formModal(c?"Edit Category":"Add Category",inp("Category Name","name",c?c.name:"","text",1)+txa("Description (اختياري)","description",c?c.description:""),c?"Save":"Create",d=>{
   const n=d.name.trim();if(!n)return"اسم الفئة مطلوب.";
   if(S.categories.some(x=>norm(x.name)===norm(n)&&(!c||x.id!==c.id)))return"هذه الفئة موجودة بالفعل.";
   if(c){c.name=n;c.description=d.description.trim()}else S.categories.push({id:uid(),name:n,description:d.description.trim(),created:today(),codes:[]});
   ok()});break}
 case"delcat":{const c=findCat(id);confirmModal(c.codes.length?"هذه الفئة تحتوي على أكواد. هل أنت متأكد من حذفها؟":"هل أنت متأكد من حذف هذه الفئة؟","Delete",()=>{S.categories=S.categories.filter(x=>x.id!==id);if(fcat===id)fcat="";ok()});break}
 case"addcode":case"editcode":{
  if(!S.categories.length){toast("أضف فئة أولًا","err");break}
  const f=a==="editcode"?allCodes().find(x=>x.k.id===id):null;
  const sel=`<div class="fld"><label>Category *</label><select name="cat">${S.categories.map(c=>`<option value="${c.id}"${(f?f.cat.id===c.id:fcat===c.id)?" selected":""}>${esc(c.name)}</option>`).join("")}</select></div>`;
  formModal(f?"Edit Code":"Add Code",sel+inp("Code Name","name",f?f.k.name:"","text",1)+inp("Short Code","shortCode",f?f.k.shortCode:"","text",1)+txa("Description (اختياري)","description",f?f.k.description:""),f?"Save":"Create",d=>{
   const n=d.name.trim(),sc=String(d.shortCode).trim(),cat=findCat(d.cat);
   if(!n||!sc)return"اسم الكود والكود مطلوبان.";if(!cat)return"الفئة غير صالحة.";
   if(cat.codes.some(x=>norm(x.name)===norm(n)&&(!f||x.id!==f.k.id)))return"اسم الكود موجود بالفعل في هذه الفئة.";
   if(f){f.cat.codes=f.cat.codes.filter(x=>x.id!==f.k.id);f.k.name=n;f.k.shortCode=sc;f.k.description=d.description.trim();cat.codes.push(f.k)}
   else cat.codes.push({id:uid(),name:n,shortCode:sc,description:d.description.trim()});
   ok()});break}
 case"delcode":confirmModal("هل أنت متأكد من حذف هذا الكود؟","Delete",()=>{S.categories.forEach(c=>c.codes=c.codes.filter(x=>x.id!==id));ok()});break;
 case"adduser":case"edituser":{const u=a==="edituser"?S.users.find(x=>x.id===id):null;
  const st=`<div class="fld"><label>Status</label><select name="status"><option value="active"${!u||u.status==="active"?" selected":""}>Active</option><option value="inactive"${u&&u.status!=="active"?" selected":""}>Inactive</option></select></div>`;
  formModal(u?"Edit User":"Add User",inp("Full Name","name",u?u.name:"","text",1)+inp("Username","username",u?u.username:"","text",1)+inp("Password"+(u?" (اتركه فارغًا لعدم التغيير)":""),"password","","password",!u)+st+`<label class="ck"><input type="checkbox" name="edit" value="1"${u&&u.edit?" checked":""}> يسمح له بإضافة وتعديل وحذف الأكواد</label>`,u?"Save":"Create User",async d=>{
   const n=d.name.trim(),un=d.username.trim(),pw=d.password;
   if(!n||!un||(!u&&!pw))return"جميع الحقول مطلوبة.";
   if(norm(un)==="admin"||S.users.some(x=>norm(x.username)===norm(un)&&(!u||x.id!==u.id)))return"اسم المستخدم موجود بالفعل.";
   const we=d.edit==="1";let ae=u&&u.authEmail,au=u&&u.authUid;
   if(pw&&!we){ae=au=undefined}
   if(we&&(pw||!au)){
    if(!pw)return"لتفعيل صلاحية التعديل اكتب كلمة مرور جديدة للموظف.";
    if(pw.length<6)return"كلمة المرور لازم تكون 6 أحرف على الأقل لصلاحية التعديل.";
    try{ae="ed"+rnd().slice(0,12)+"@shortcodes.app";au=await fbSignUp(ae,pw)}catch(ex){return"تعذر إنشاء صلاحية التعديل: "+fbMsg(ex)}}
   const rec={name:n,username:un,status:d.status,edit:we,authEmail:ae,authUid:au};
   if(u){Object.assign(u,rec);if(pw){u.salt=rnd();u.hash=await H(u.salt,pw)}}
   else{const salt=rnd();S.users.push(Object.assign({id:uid(),salt:salt,hash:await H(salt,pw)},rec))}
   ok();toast(u?"تم حفظ التعديلات":"تم إنشاء المستخدم بنجاح")});break}
  case"toguser":{const u=S.users.find(x=>x.id===id);if(u){u.status=u.status==="active"?"inactive":"active";ok()}break}
 case"deluser":confirmModal("هل أنت متأكد من حذف هذا المستخدم؟","Delete",()=>{S.users=S.users.filter(x=>x.id!==id);ok()});break;
 case"retry":if(canWrite())pushRemote();break;
 case"discard":confirmModal("سيتم التخلي عن أي تعديلات غير محفوظة وتحميل النسخة الموجودة على Firebase. هل أنت متأكد؟","Reload",async()=>{const r=await fetchRemote();if(!r||!r.cats){toast("تعذر جلب البيانات من Firebase","err");return}setRem(r);S=fromRemote(r);await migrate(S);save(true);setSync("","");render();toast("تم تحميل النسخة من Firebase")},"Reload From Server");break;
 case"etoggle":if(session&&session.canEdit){session.edit=!session.edit;render();toast(session.edit?"وضع التعديل مفعّل":"تم إغلاق وضع التعديل")}break;
 case"eaddcat":{if(!session||!session.canEdit||!session.edit)break;
  formModal("Add Folder",inp("Folder Name","name","","text",1),"Create",d=>{
   const n=d.name.trim();if(!n)return"اسم الفولدر مطلوب.";
   if(S.categories.some(x=>norm(x.name)===norm(n)))return"هذه الفئة موجودة بالفعل.";
   S.categories.push({id:uid(),name:n,description:"",created:today(),codes:[]});logAct({a:"addFolder",c:n});save();refreshUI()});break}
 case"dadd":{if(!session||session.role!=="user"||!session.canEdit||!session.edit)break;
  if(!S.categories.length){toast("لا توجد فولدرات، فعّل وضع التعديل وأضف فولدر أولًا","err");break}
  const sel=`<div class="fld"><label>Folder *</label><select name="cat">${S.categories.map(c=>`<option value="${c.id}"${ucat===c.id?" selected":""}>${esc(c.name)}</option>`).join("")}</select></div>`;
  formModal("Add Code",sel+inp("Code Name","name","","text",1)+inp("Short Code","shortCode","","text",1)+txa("Description (اختياري)","description",""),"Create",d=>{
   const n=d.name.trim(),sc=String(d.shortCode).trim(),c=findCat(d.cat);
   if(!n||!sc)return"اسم الكود والكود مطلوبان.";if(!c)return"الفولدر غير صالح.";
   if(c.codes.some(x=>norm(x.name)===norm(n)))return"اسم الكود موجود بالفعل في هذه الفئة.";
   logAct({a:"addCode",c:c.name,k:n,n:sc});c.codes.push({id:uid(),name:n,shortCode:sc,description:d.description.trim()});
   save();refreshUI();toast("✓ تم إضافة الكود")});break}
 case"ecode":{if(!session||!session.canEdit||!session.edit)break;const fx=allCodes().find(x=>x.k.id===id);if(!fx)break;const c=fx.cat,k=fx.k;
  formModal(k?"Edit Code":"Add Code",inp("Code Name","name",k?k.name:"","text",1)+inp("Short Code","shortCode",k?k.shortCode:"","text",1)+txa("Description (اختياري)","description",k?k.description:""),k?"Save":"Create",d=>{
   const n=d.name.trim(),sc=String(d.shortCode).trim();if(!n||!sc)return"اسم الكود والكود مطلوبان.";
   if(c.codes.some(x=>norm(x.name)===norm(n)&&(!k||x.id!==k.id)))return"اسم الكود موجود بالفعل في هذه الفئة.";
   if(k){if(k.name!==n||k.shortCode!==sc||k.description!==d.description.trim())logAct({a:"editCode",c:c.name,k:n,on:k.name,o:k.shortCode,n:sc});k.name=n;k.shortCode=sc;k.description=d.description.trim()}else{logAct({a:"addCode",c:c.name,k:n,n:sc});c.codes.push({id:uid(),name:n,shortCode:sc,description:d.description.trim()})}
   save();refreshUI()});break}
 case"edel":{if(!session||!session.canEdit)break;const c=findCat(ucat);if(!c)break;confirmModal("هل أنت متأكد من حذف هذا الكود؟","Delete",()=>{c.codes=c.codes.filter(x=>x.id!==id);save();refreshUI()});break}

 case"sugadd":case"sugedit":{if(!sugOK())break;
  const f=a==="sugedit"?allCodes().find(x=>x.k.id===id):null;if(a==="sugedit"&&!f)break;
  const note='<p style="margin:0 0 14px;color:var(--mut);font-size:.88rem;line-height:1.7">'+(f?"التعديل مش هيتطبق غير بعد موافقة الأدمن.":"الكود مش هيظهر للموظفين غير بعد موافقة الأدمن، وهو اللي هيحدد الفولدر المناسب.")+'</p>';
  formModal(f?"اقتراح تعديل كود":"اقتراح كود جديد",note+inp("Code Name","name",f?f.k.name:"","text",1)+inp("Short Code","shortCode",f?f.k.shortCode:"","text",1)+txa("Description (اختياري)","description",f?f.k.description:""),"إرسال للأدمن",async d=>{
   const n=d.name.trim(),sc=String(d.shortCode).trim(),ds=d.description.trim();
   if(!n||!sc)return"اسم الكود والكود مطلوبان.";
   if(n.length>=100||sc.length>=200||ds.length>=300)return"النص طويل جدًا.";
   if(f&&n===f.k.name&&sc===f.k.shortCode&&ds===f.k.description)return"ما فيش تغيير عن الكود الحالي.";
   const res=await createCReq({type:f?"edit":"add",name:n,shortCode:sc,description:ds,by:String(session.name).slice(0,79),uid:session.uid,targetId:f?f.k.id:"",oldName:f?f.k.name:"",oldCode:f?f.k.shortCode:"",catName:f?f.cat.name:((findCat(ucat)||{}).name||"")});
   if(res==="ok"){toast("✓ تم إرسال الطلب للأدمن");return}
   return res==="deny"?"إرسال الطلبات غير مفعّل حاليًا، تواصل مع الأدمن.":"تعذر إرسال الطلب، تأكد من الاتصال وحاول مرة أخرى."});break}
 case"creqref":loadCReqs();toast("جاري التحديث");break;
 case"creqno":{const q=CREQ.list.find(x=>x.id===id);if(!q)break;
  confirmModal("رفض ومسح طلب «"+esc(q.name)+"» من "+esc(q.by)+"؟","Reject",async()=>{try{await creqDel(id);CREQ.list=CREQ.list.filter(x=>x.id!==id);render();toast("تم رفض الطلب")}catch(e){toast(fbMsg(e),"err")}},"Reject Request");break}
 case"creqok":{const q=CREQ.list.find(x=>x.id===id);if(!q)break;
  const ed=q.type==="edit",ex=ed?allCodes().find(x=>x.k.id===q.targetId):null;
  const pre=ex?ex.cat.id:((S.categories.find(c=>norm(c.name)===norm(q.catName))||{}).id||"");
  const info=`<p style="margin:0 0 14px;line-height:1.8;font-size:.9rem">${ed?"طلب تعديل":"طلب إضافة"} من <b>${esc(q.by)}</b>${ed?(ex?`<br>الكود الحالي: <b>${esc(ex.k.name)}</b> <span class="ltr">(${esc(ex.k.shortCode)})</span> في «${esc(ex.cat.name)}»`:'<br><b style="color:#b00600">⚠ الكود الأصلي اتحذف أو اتغيّر</b>'):""}</p>`;
  const sel=`<div class="fld"><label>الفولدر *</label><select name="cat" onchange="document.getElementById('nfw').style.display=this.value==='__new'?'block':'none'"><option value="">— اختر الفولدر —</option>${S.categories.map(c=>`<option value="${c.id}"${pre===c.id?" selected":""}>${esc(c.name)}</option>`).join("")}<option value="__new">➕ فولدر جديد...</option></select></div><div class="fld" id="nfw" style="display:none"><label>اسم الفولدر الجديد *</label><input name="newcat"></div>`;
  formModal(ed?"مراجعة طلب تعديل":"مراجعة طلب إضافة",info+sel+inp("Code Name","name",q.name,"text",1)+inp("Short Code","shortCode",q.shortCode,"text",1)+txa("Description (اختياري)","description",q.description),"Approve",d=>{
   const n=d.name.trim(),sc=String(d.shortCode).trim(),dsc=d.description.trim();
   if(!n||!sc)return"اسم الكود والكود مطلوبان.";
   if(ed&&!ex)return"الكود الأصلي مش موجود — ارفض الطلب.";
   let cat,isNew=false;
   if(d.cat==="__new"){const fn=String(d.newcat||"").trim();if(!fn)return"اكتب اسم الفولدر الجديد.";
    cat=S.categories.find(x=>norm(x.name)===norm(fn));
    if(!cat){isNew=true;cat={id:uid(),name:fn,description:"",created:today(),codes:[]}}}
   else cat=findCat(d.cat);
   if(!cat)return"اختر الفولدر.";
   if(cat.codes.some(x=>norm(x.name)===norm(n)&&(!ex||x.id!==ex.k.id)))return"اسم الكود موجود بالفعل في هذا الفولدر.";
   if(isNew)S.categories.push(cat);
   S.log=S.log||[];const lg=e=>{S.log.push(Object.assign({id:uid(),t:new Date().toISOString(),by:q.by},e));if(S.log.length>150)S.log=S.log.slice(-150)};
   if(isNew)lg({a:"addFolder",c:cat.name});
   if(ex){lg({a:"editCode",c:cat.name,k:n,on:ex.k.name,o:ex.k.shortCode,n:sc});
    if(ex.cat===cat){ex.k.name=n;ex.k.shortCode=sc;ex.k.description=dsc}
    else{ex.cat.codes=ex.cat.codes.filter(x=>x.id!==ex.k.id);ex.k.name=n;ex.k.shortCode=sc;ex.k.description=dsc;cat.codes.push(ex.k)}}
   else{lg({a:"addCode",c:cat.name,k:n,n:sc});cat.codes.push({id:uid(),name:n,shortCode:sc,description:dsc})}
   cdel.add(q.id);CREQ.list=CREQ.list.filter(x=>x.id!==q.id);ok();toast("تمت الموافقة ✓ الكود ظاهر للموظفين خلال دقيقة");
   (async()=>{await pushRemote();await flushCDel()})()});break}
 case"expjson":exportJSON();break;
 case"impjson":$("#impf").click();break;
 case"reset":confirmModal("تحذير: سيتم حذف جميع Categories وCodes وUsers. هل أنت متأكد؟","Reset Everything",()=>{S.categories=[];S.users=[];fcat="";ok();toast("تم حذف جميع البيانات")},"Reset All Data");break;
 }}
document.addEventListener("click",e=>{const t=e.target.closest("[data-act]");if(!t)return;
 try{act(t.dataset.act,t.dataset.id)}catch(x){console.error(x);toast("حدث خطأ غير متوقع","err")}});
document.addEventListener("input",e=>{if(e.target.id!=="uq")return;q=e.target.value;$("#ubody").innerHTML=userBody();$("#qx").hidden=!q});
document.addEventListener("change",e=>{if(e.target.dataset&&e.target.dataset.chg==="fcat"){fcat=e.target.value;render()}});

document.addEventListener("change",e=>{if(e.target.id==="impf"){const f=e.target.files[0];e.target.value="";if(f)importJSON(f)}});
window.addEventListener("error",e=>console.error(e.error||e.message));
load().then(()=>{render();setInterval(poll,60000);setInterval(()=>{if(isAdm()&&!document.hidden){loadReqs();loadCReqs()}},30000)});
</script>
</body>
</html>
